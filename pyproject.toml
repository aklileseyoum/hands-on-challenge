[project]
name = "black-practice"
version = "0.1.0"
description = "This is a practice project for mypy, pytest, ruff, and black."
authors = [
    {name = "aklileseyoum",email = "aklileseyoum294@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
packages = [{include = "black_practice", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]
